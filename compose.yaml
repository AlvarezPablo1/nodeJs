services:
  db:
    image: postgres:17
    container_name: turnero-db
    environment:
      POSTGRES_USER: turnero
      POSTGRES_PASSWORD: turnero
      POSTGRES_DB: turnero
      TZ: America/Argentina/Buenos_Aires
      PGTZ: America/Argentina/Buenos_Aires
    ports:
      - "5432:5432"
    volumes:
      - turnero-db-data:/var/lib/postgresql/data

volumes:
  turnero-db-data: